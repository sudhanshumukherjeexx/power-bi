# fabric-cicd replaces each find_value in the PBIP files with the value for the target environment.
# Use the Dev values in the files you commit; list every environment here.
find_replace:
  # SQL server the semantic model reads from (example placeholder values)
  - find_value: "sql-dev.northwind.example"
    replace_value:
      dev: "sql-dev.northwind.example"
      test: "sql-test.northwind.example"
      prod: "sql-prod.northwind.example"

  # Lakehouse ID for a Direct Lake model (example GUIDs)
  - find_value: "11111111-1111-1111-1111-111111111111"
    replace_value:
      dev: "11111111-1111-1111-1111-111111111111"
      test: "22222222-2222-2222-2222-222222222222"
      prod: "33333333-3333-3333-3333-333333333333"
