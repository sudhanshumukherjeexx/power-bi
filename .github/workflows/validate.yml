name: Validate and deploy

# Every push and pull request is validated: generated files must be current, datasets and expected results
# must agree with the data, every link, id and reference must resolve, and the critical journeys, accessibility
# and layout must pass in a real browser. Pushes to main then publish the site/ folder to GitHub Pages, but only
# if both jobs passed, so a broken build never goes live. Dev tools are pinned in package-lock.json; actions are
# pinned to commit SHAs (the comment names the release) and Dependabot proposes updates.
# (Repository settings → Pages → Source must be "GitHub Actions".)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly: catch content whose verification date has expired
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dev tools (lockfile)
        run: npm ci
      - name: Generated data is reproducible
        run: node tools/generate-data.js --check
      - name: Generated site files are current
        run: node tools/build.js --check
      - name: Content, curriculum, scoring, import safety, leaks, links, SQL and scripts
        run: node tests/run.js
      - name: HTML validity
        run: npm run validate:html

  sql:
    # Every SQL example declares a dialect (portable, sqlite, tsql) and must parse in it; portable SQL must also
    # parse as T-SQL. Execution: tests/sql.test.js (SQLite, in validate) and sql-server.yml (SQL Server 2022).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Extract SQL by dialect
        run: node tools/sql-catalog.js --extract .sql-lint
      - name: Parse with SQLFluff
        run: |
          for d in sqlite tsql; do
            echo "::group::$d"
            sqlfluff parse --dialect "$d" ".sql-lint/$d" > /dev/null || { sqlfluff parse --dialect "$d" ".sql-lint/$d" | grep -B2 -A2 PRS; exit 1; }
            echo "all $d blocks parse"
            echo "::endgroup::"
          done

  browser:
    # Critical journeys, axe-core accessibility (no serious or critical issues, both themes) and responsive layout
    # at 1440/1024/768/390, against the generated site/ served as GitHub Pages serves it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    # Publish site/ only for main, only after validation and the browser tests passed. Scheduled runs never deploy.
    needs: [validate, sql, browser]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  external-links:
    # Informational: official documentation moves. Never blocks a merge or a deploy.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node tests/external-links.js
