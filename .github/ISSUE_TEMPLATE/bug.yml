name: Bug (site not working)
description: Something on the website doesn't work as it should.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page, including anything after #
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: e.g. Safari on iPhone 15, Edge on Windows 11
  - type: checkboxes
    id: offline
    attributes:
      label: Context
      options:
        - label: I was using the installed app or offline mode
        - label: I had imported a progress file
