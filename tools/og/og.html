<!DOCTYPE html>
<!-- Source of site/assets/og/og-default.png (1200×630), the social preview image. Render: node tools/render-og.js -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Power BI Holy Grail: social preview</title>
<style>
@font-face{font-family:'IBM Plex Sans';font-weight:400;src:url(../../site/assets/fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:600;src:url(../../site/assets/fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:700;src:url(../../site/assets/fonts/ibm-plex-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url(../../site/assets/fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url(../../site/assets/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
html,body{margin:0}
body{width:100vw;height:100vh;background:#16181D;color:#F3F4F2;font-family:'IBM Plex Sans',sans-serif;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgb(255 255 255 / .035) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255 / .035) 1px,transparent 1px);background-size:40px 40px}
.in{position:absolute;left:88px;top:78px;right:88px}
.brand{display:flex;align-items:center;gap:16px;font-weight:600;font-size:26px;color:#F3F4F2}
.mark{width:46px;height:46px;border:1.5px solid #383E47;border-radius:6px;box-shadow:inset 0 -5px 0 #D9A514;display:grid;place-items:center;font-weight:700;font-size:19px}
h1{font-size:68px;line-height:1.05;letter-spacing:-.02em;font-weight:700;margin:58px 0 0;max-width:15ch}
.rule{margin-top:34px;border-left:3px solid #D9A514;padding-left:20px;font-size:25px;color:#A9AFB8;line-height:1.45;max-width:46ch}
.ids{position:absolute;left:88px;bottom:62px;display:flex;gap:14px;font-family:'IBM Plex Mono',monospace;font-size:19px;color:#A9AFB8}
.ids span{border:1px solid #383E47;border-radius:4px;padding:6px 12px}
.ids .sev{color:#E0A84A;border-color:#E0A84A}
.url{position:absolute;right:88px;bottom:70px;font-family:'IBM Plex Mono',monospace;font-size:19px;color:#858C97}
</style>
</head>
<body>
<div class="grid"></div>
<div class="in">
  <div class="brand"><span class="mark">BI</span>Power BI Holy Grail</div>
  <h1>Learn Power BI by doing the work.</h1>
  <div class="rule">Hands-on skills you can check, then real BI tickets, incidents and decisions at a simulated company.</div>
</div>
<div class="ids"><span>BI-1042</span><span>INC-2044</span><span class="sev">SEV3</span><span>ADR-009</span></div>
<div class="url">free · open source · no account</div>
</body>
</html>
