<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-FHgKa2IbXQCzK+k475QjjfLA1rZkEKtt6G4y+gXvLzg=' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Page not found · Power BI Holy Grail</title>
<style>
:root{--bg:#F7F7F4;--panel:#fff;--ink:#16181D;--ink-2:#5C626D;--line:#E2E3DF;--yellow:#D9A514;--on:#16181D}
@media (prefers-color-scheme:dark){:root{--bg:#0D0F12;--panel:#15181D;--ink:#F3F4F2;--ink-2:#A9AFB8;--line:#292E35;--yellow:#E2B636;--on:#0D0F12;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;padding:24px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px;max-width:440px;text-align:center}
.mark{width:44px;height:44px;margin:0 auto 12px;background:#16181D;border:1px solid #383E47;box-shadow:inset 0 -4px 0 #D9A514;border-radius:4px;display:grid;place-items:center;color:#F3F4F2;font-weight:700}
h1{font-size:1.4rem;margin:0 0 6px}p{color:var(--ink-2);margin:0 0 18px}
.links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
a{display:inline-block;padding:9px 14px;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:inherit;font-weight:600}
a.primary{background:var(--yellow);border-color:var(--yellow);color:var(--on)}
</style>
</head>
<body>
<div class="box">
  <div class="mark">BI</div>
  <h1>That page doesn't exist</h1>
  <p>The link may be old, or the address has a typo.</p>
  <div class="links"><a class="primary" id="home" href="/">Go to the course</a><a id="cards" href="/flashcards.html">Flashcards</a></div>
</div>
<script>
/* GitHub project sites live under /<repo>/, so find that base from the current address */
(function(){
  var seg=location.pathname.split('/').filter(Boolean);
  var base=(/\.github\.io$/.test(location.hostname)&&seg.length)?'/'+seg[0]+'/':'/';
  document.getElementById('home').href=base;
  document.getElementById('cards').href=base+'flashcards.html';
})();
</script>
</body>
</html>
